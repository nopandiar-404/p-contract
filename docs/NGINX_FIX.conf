# Nginx Configuration Fix for Content-Length Error
# This file shows the exact Nginx configuration needed

# Location: /etc/nginx/nginx.conf or /etc/nginx/conf.d/default.conf

# ============================================
# BEFORE (Current - causing error)
# ============================================
http {
    # ... other settings ...
    client_max_body_size 40M;  # ❌ TOO SMALL - causes 413 errors
}

# ============================================
# AFTER (Fixed - working)
# ============================================
http {
    # ... other settings ...
    
    # MAIN FIX: Increase client body size
    client_max_body_size 512M;
    
    # TIMEOUT SETTINGS: For large file processing
    fastcgi_send_timeout 300s;        # Time to send to PHP
    fastcgi_read_timeout 300s;        # Time to read from PHP
    proxy_send_timeout 300s;          # Time to send to backend
    proxy_read_timeout 300s;          # Time to read from backend
    
    # BUFFER SETTINGS: For upload buffering
    fastcgi_buffer_size 128k;         # Single buffer size
    fastcgi_buffers 4 256k;           # Multiple buffers
    fastcgi_busy_buffers_size 256k;   # Busy buffer size
    
    # ... rest of config ...
}

# ============================================
# OR If using server block (more typical)
# ============================================
server {
    listen 80;
    listen 443 ssl http2;
    server_name your-domain.com;
    
    # FILE UPLOAD LIMITS
    client_max_body_size 512M;
    
    # TIMEOUTS
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # BUFFERS
    fastcgi_buffer_size 128k;
    fastcgi_buffers 4 256k;
    fastcgi_busy_buffers_size 256k;
    
    # ... rest of server block ...
}

# ============================================
# STEPS TO APPLY
# ============================================
# 1. Find your nginx.conf file:
#    - /etc/nginx/nginx.conf (Linux standard)
#    - /usr/local/nginx/conf/nginx.conf (custom install)
#    - C:\nginx\conf\nginx.conf (Windows)
#
# 2. Edit the file (vi, nano, or text editor):
#    sudo nano /etc/nginx/nginx.conf
#
# 3. Find the "http {" block
#
# 4. Add or update client_max_body_size to 512M
#
# 5. Test syntax:
#    sudo nginx -t
#    Output should: "successful" or "OK"
#
# 6. Reload Nginx:
#    sudo systemctl reload nginx
#    OR
#    sudo service nginx reload
#    OR (Laragon Windows):
#    Nginx → Restart in Laragon tray
#
# 7. Test with upload:
#    Upload 40-50MB file
#    Should work without 413 error

# ============================================
# VERIFICATION
# ============================================
# Check if setting is loaded:
# nginx -T 2>&1 | grep client_max_body_size
# Should show: 512M

# Monitor errors during upload:
# tail -f /var/log/nginx/error.log

# ============================================
# TROUBLESHOOTING
# ============================================
# Syntax error?
#   sudo nginx -t
#   Will show you the line number with error

# Still getting 413?
#   1. Verify you edited correct nginx.conf
#   2. Verify nginx reloaded (ps aux | grep nginx)
#   3. Check there's no other config overriding it
#   4. Try full restart: sudo systemctl restart nginx

# Nginx won't start?
#   1. Check syntax: sudo nginx -t
#   2. Check logs: sudo systemctl status nginx
#   3. Restore backup of nginx.conf
#   4. Try again

# ============================================
# COMMON LOCATIONS
# ============================================
# Linux (Ubuntu/Debian):
#   /etc/nginx/nginx.conf
#   /etc/nginx/sites-available/default
#   /etc/nginx/conf.d/default.conf
#
# CentOS/RHEL:
#   /etc/nginx/nginx.conf
#   /etc/nginx/conf.d/default.conf
#
# macOS:
#   /usr/local/etc/nginx/nginx.conf
#
# Laragon (Windows):
#   C:\laragon\etc\nginx\nginx.conf
#
# Manual Nginx (Windows):
#   C:\nginx\conf\nginx.conf
