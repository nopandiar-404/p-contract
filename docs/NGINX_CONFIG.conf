# Nginx Configuration untuk Post Size
# File: /etc/nginx/nginx.conf atau /etc/nginx/conf.d/default.conf

# Tambahkan atau update di dalam block http { }:
http {
    # Increase POST size limit
    client_max_body_size 1G;
    
    # Increase timeouts untuk upload besar
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

# Atau khusus untuk Laravel di dalam server block:
server {
    listen 80;
    server_name your-domain.com;
    
    # Increase POST size limit
    client_max_body_size 1G;
    
    # Timeouts
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;
    
    # ... rest of config
}

# Restart Nginx setelah perubahan:
# sudo systemctl restart nginx
# atau
# sudo service nginx restart
