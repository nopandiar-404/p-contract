# Apache Configuration untuk Post Size
# File: .htaccess atau httpd.conf

# Di dalam .htaccess (root aplikasi):
<IfModule mod_rewrite.c>
    RewriteEngine On
    
    # Tidak langsung berhubungan dengan POST size
    # Tapi pastikan mod_rewrite aktif
</IfModule>

# Di httpd.conf atau virtual host:
<VirtualHost *:80>
    ServerName your-domain.com
    DocumentRoot /var/www/html/your-project
    
    # Tidak ada setting POST size di Apache
    # Semua dikontrol di php.ini
    
    <Directory /var/www/html/your-project>
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.php [L]
        </IfModule>
    </Directory>
</VirtualHost>

# Untuk Apache, utama adalah mengubah php.ini
# Restart Apache setelah perubahan:
# sudo systemctl restart apache2
# atau
# sudo service apache2 restart
